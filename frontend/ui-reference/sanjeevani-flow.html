<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sanjeevani — guided flow</title>
<style>
:root{
  --bg:#0E1512; --bg-2:#131D1A; --surface:#17231F; --surface-2:#1D2C27;
  --line:#25382F; --line-soft:#1F302A;
  --accent:#84D3B8; --accent-ink:#0B1714; --accent-dim:#2E5347; --accent-soft:#1B2F29;
  --ok:#84D3B8; --warn:#E3B461; --warn-soft:#2E2718; --bad:#E08A7E; --bad-soft:#2E1E1C;
  --text:#E9F1EE; --text-2:#A7BCB5; --text-3:#728880;
  --r:14px; --r-lg:20px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}

/* ---------- shell ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(14,21,18,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.brand p{font-size:12px;color:var(--text-3)}
.steps{display:flex;gap:8px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-2);font:600 13px/1 var(--font);display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap;transition:.15s}
.step-chip:hover{border-color:var(--accent-dim);color:var(--text)}
.step-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-chip.done{color:var(--accent);border-color:var(--accent-dim)}

.stage{max-width:560px;margin:0 auto;padding:22px 18px 120px}
.screen{display:none;animation:in .22s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.footbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(14,21,18,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line-soft);padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.footbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.progress{flex:1;height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.nav-btn{height:44px;min-width:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 14px var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nav-btn:hover:not(:disabled){border-color:var(--accent-dim)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepcount{font:600 12px var(--font);color:var(--text-3);min-width:46px;text-align:center}

/* ---------- primitives ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.mute{background:var(--surface-2);color:var(--text-2)}
h2.title{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.2;margin-bottom:6px}
p.sub{font-size:14px;color:var(--text-2);margin-bottom:22px}
.label{display:block;font:600 13px var(--font);color:var(--text-2);margin-bottom:8px}
.field{width:100%;height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--text);font:400 16px var(--font);padding:0 16px;outline:none}
.field:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;margin-bottom:18px}
.seg{flex:1;height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 15px var(--font);cursor:pointer;transition:.15s}
.seg:hover{border-color:var(--accent-dim)}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.card p{font-size:13px;color:var(--text-2)}
.cta{width:100%;height:58px;border-radius:var(--r);border:none;background:var(--accent);color:var(--accent-ink);font:700 16px var(--font);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-top:24px}
.cta.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.cta:disabled{background:var(--surface-2);color:var(--text-3);cursor:not-allowed}
.foot-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text-3);margin-top:12px}
.consent{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-lg);border:1px solid var(--accent-dim);background:var(--accent-soft);cursor:pointer}
.box{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:15px}
.box.off{background:transparent;border:2px solid var(--text-3);color:transparent}
.consent p{font-size:14px;line-height:1.5}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat div{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px}
.stat span{display:block;font-size:12px;color:var(--text-3);margin-bottom:6px}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.5px}
.list{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:none}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:600 13px var(--font);flex-shrink:0}
.avatar.bad{background:var(--bad-soft);color:var(--bad)}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;font-size:15px;font-weight:600}
.item .meta span{font-size:12.5px;color:var(--text-3)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sec h3{font-size:17px;font-weight:600}
.sec span{font-size:12px;color:var(--text-3)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1}
.unit{font-size:13px;color:var(--text-3);font-weight:500}
.camera{position:relative;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(circle at 50% 38%,#1B2A25 0%,#0D1412 72%,#080C0B 100%);border:1px solid var(--line);padding:22px 18px;min-height:520px;display:flex;flex-direction:column;justify-content:space-between}
.chip-pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font:600 14px var(--font)}
.quote{background:var(--bg-2);border-left:2px solid var(--accent-dim);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--text-2);font-style:italic;margin-top:10px}
.quote em{display:block;font-style:normal;font-size:12px;color:var(--text-3);margin-top:4px}
.turn{margin-bottom:14px}
.turn .who{display:flex;justify-content:space-between;font:600 12px var(--font);color:var(--text-3);margin-bottom:6px;padding:0 4px}
.turn .who b{color:var(--accent);font-weight:600}
.bubble{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px}
.bubble .en{font-size:13px;color:var(--text-3);font-style:italic;margin-top:6px}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:56px;margin:20px 0}
.wave i{width:4px;border-radius:999px;background:var(--accent);opacity:.85}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font:600 12px var(--font)}
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 20px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font:600 14px var(--font);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px;font-size:13px;line-height:1.5;margin-bottom:14px}
.note.info{background:var(--accent-soft);color:var(--text)}
.note.warn{background:var(--warn-soft);color:var(--text)}
.note.bad{background:var(--bad-soft);color:var(--text)}
.note b{display:block;margin-bottom:2px;font-size:13.5px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.scroll-x{overflow-x:auto}
</style>
</head>
<body>

<div class="rail">
  <div class="brand">
    <div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h3l2-6 4 12 2.5-8 1.5 2h5"/></svg></div>
    <div><h1>Sanjeevani</h1><p>Rural diagnostic · guided flow</p></div>
  </div>

<div class="stage" id="stage"></div>

<div class="footbar">
  <div class="footbar-in">
    <button class="nav-btn" id="prev">←</button>
    <span class="stepcount" id="count">1 / 20</span>
    <div class="progress"><i id="bar" style="width:5%"></i></div>

  </div>
</div>

{label:"5 · Results", html:`
<div class="top"><div class="icon-btn">‹</div><span class="tag accent">Camp triage</span></div>

/* ---------- runtime ---------- */
const stage=document.getElementById('stage'),rail=document.getElementById('steps'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      bar=document.getElementById('bar'),count=document.getElementById('count');
let cur=0;

SCREENS.forEach((s,i)=>{
  const d=document.createElement('div');d.className='screen';d.innerHTML=s.html;stage.appendChild(d);
  const c=document.createElement('button');c.className='step-chip';c.textContent=s.label;
  c.onclick=()=>go(i);rail.appendChild(c);
});

function go(i){
  cur=Math.max(0,Math.min(SCREENS.length-1,i));
  [...stage.children].forEach((el,n)=>el.classList.toggle('on',n===cur));
  [...rail.children].forEach((el,n)=>{el.classList.toggle('on',n===cur);el.classList.toggle('done',n<cur)});
  rail.children[cur].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  bar.style.width=((cur+1)/SCREENS.length*100)+'%';
  count.textContent=(cur+1)+' / '+SCREENS.length;
  prev.disabled=cur===0;
  next.textContent=cur===SCREENS.length-1?'Restart':'Next →';
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.onclick=()=>go(cur-1);
next.onclick=()=>go(cur===SCREENS.length-1?0:cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft'&&cur>0)prev.click()});

stage.addEventListener('click',e=>{
  const jump=e.target.closest('[data-go]');
  if(jump){go(+jump.dataset.go);return}
  const seg=e.target.closest('[data-seg]');
  if(seg){[...seg.parentElement.children].forEach(b=>b.classList.remove('on'));seg.classList.add('on')}
  const con=e.target.closest('[data-consent]');
  if(con){con.querySelector('.box').classList.toggle('off')}
});

/* waveform */
(function(){
  const w=document.getElementById('wave');if(!w)return;
  for(let i=0;i<34;i++){const b=document.createElement('i');w.appendChild(b)}
  setInterval(()=>{
    [...w.children].forEach((b,i)=>{
      const h=Math.abs(Math.sin(Date.now()/320+i*.45))*36+6;
      b.style.height=h+'px';b.style.opacity=(.35+h/60).toFixed(2);
    });
  },120);
})();

go(0);
</script>
