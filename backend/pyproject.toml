[project]
name = "sanjeevani-backend"
version = "0.1.0"
description = "Sanjeevani backend — FastAPI, Neo4j, rPPG, Gemini seam"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "neo4j>=5.20",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.4",
    "reportlab>=4.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "pypdf2>=3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
